<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
</head>
<body>
    <header class="site-header">
        <nav class="site-nav">
            <div class="nav-container">
                <a href="{{ "/" | relative_url }}" class="nav-link {% if page.url == "/" %}active{% endif %}">Home</a>
                <a href="{{ "/about.html" | relative_url }}" class="nav-link {% if page.url == "/about.html" %}active{% endif %}">About me</a>
                <a href="{{ "/publication.html" | relative_url }}" class="nav-link {% if page.url == "/publication.html" %}active{% endif %}">Publication</a>
                <a href="{{ "/patents.html" | relative_url }}" class="nav-link {% if page.url == "/patents.html" %}active{% endif %}">Patents</a>
                <a href="{{ "/projects.html" | relative_url }}" class="nav-link {% if page.url == "/projects.html" %}active{% endif %}">Projects</a>
                <a href="{{ "/contact.html" | relative_url }}" class="nav-link {% if page.url == "/contact.html" %}active{% endif %}">Contact</a>
            </div>
        </nav>
    </header>

    <main class="page-content">
        <div class="wrapper">
            {{ content }}
        </div>
    </main>

    <footer class="site-footer">
    </footer>
</body>
</html>
